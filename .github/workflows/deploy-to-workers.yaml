name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set wrangler.jsonc
        env:
          WRANGLER_WORKER_NAME: ${{ secrets.WRANGLER_WORKER_NAME }}
          WRANGLER_CUSTOM_DOMAIN: ${{ secrets.WRANGLER_CUSTOM_DOMAIN }}
          WRANGLER_REDIRECT_KV_ID: ${{ secrets.WRANGLER_REDIRECT_KV_ID }}
        run: |
          cp wrangler.example.jsonc wrangler.jsonc
          sed -i "s/<YOUR_WORKER_NAME>/${WRANGLER_WORKER_NAME}/g" wrangler.jsonc
          sed -i "s/<YOUR_CUSTOM_DOMAIN>/${WRANGLER_CUSTOM_DOMAIN}/g" wrangler.jsonc
          sed -i "s/<YOUR_REDIRECT_KV_ID>/${WRANGLER_REDIRECT_KV_ID}/g" wrangler.jsonc

      - name: Set environment variables
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          touch .env.production
          echo "VITE_SITE_URL=${VITE_SITE_URL}" >> .env.production

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
